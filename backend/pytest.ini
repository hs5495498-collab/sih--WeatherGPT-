[pytest]
testpaths = tests

# test_nlu.py and test_orchestrator.py are pre-existing manual scripts, not
# pytest tests -- they call asyncio.run() at import time and hit the real
# NLU/weather pipeline over the network. Importing them during collection
# would make network calls and print output instead of asserting anything,
# so they're excluded from the automated suite. Run them directly instead:
#   python tests/test_nlu.py
#   python tests/test_orchestrator.py
addopts = -v
